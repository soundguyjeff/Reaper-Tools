name: Validate Wwise Relay
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lupa==2.8
      - run: python tests/run_tests.py
      - run: python tests/test_reapack.py
      - name: Windows PowerShell 5.1 file safety
        shell: powershell
        run: ./tests/test_windows.ps1
      - name: Deliverable matches sources
        shell: bash
        run: git diff --exit-code -- 'Wwise Relay.lua'
